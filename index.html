<title>Bydlení v dojezdu Brna</title>
<style>
:root {
  --papir: #E9EDEF;
  --karta: #FFFFFF;
  --inkoust: #131B22;
  --tlumene: #5C6B76;
  --linka: #CBD5DA;
  --tabule: #131B22;
  --jantar: #F0B429;
  --radius: 3px;
  --uzke: "Arial Narrow", "Liberation Sans Narrow", "Roboto Condensed", "Archivo Narrow", system-ui, sans-serif;
  --text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
/* Atribut hidden dává display:none, ale prohrává s explicitním display
   u .pole a podobných. Bez tohohle se prázdné filtry neskryjí. */
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--papir); color: var(--inkoust);
  font-family: var(--text); font-size: 15px; line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
button, select, input, a { -webkit-tap-highlight-color: rgba(0,0,0,.06); }
button, .linka-chip, .odkazy a { touch-action: manipulation; }
a { color: inherit; }
.obal { max-width: 1180px; margin: 0 auto; padding: 0 20px 80px; }

/* --- odjezdová tabule ---------------------------------------------------- */
.tabule { background: var(--tabule); color: #fff; }
.tabule-vnitrek { max-width: 1180px; margin: 0 auto; padding: 22px 20px 18px; }
.tabule h1 {
  font-family: var(--uzke); font-size: 34px; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase; margin: 0;
}
.tabule .podtitul {
  color: #93A3AE; font-size: 13px; margin-top: 4px;
  font-variant-numeric: tabular-nums;
}
.tabule .podtitul b { color: var(--jantar); font-weight: 600; }
.linky { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.linka-chip {
  display: flex; align-items: baseline; gap: 8px; cursor: pointer;
  background: #1E2A34; border: 1px solid #2C3A45; border-radius: var(--radius);
  padding: 6px 11px; color: #C6D2DA; font-family: var(--uzke);
  font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
}
.linka-chip:hover { border-color: #465866; }
.linka-chip[aria-pressed="true"] { background: var(--jantar); color: #131B22; border-color: var(--jantar); }
.linka-chip .pocet { font-variant-numeric: tabular-nums; font-weight: 700; }
.linka-chip .tecka { width: 9px; height: 9px; border-radius: 50%; align-self: center; }

/* --- filtry -------------------------------------------------------------- */
.filtry {
  position: sticky; top: 0; z-index: 20; background: rgba(233,237,239,.94);
  backdrop-filter: blur(6px); border-bottom: 1px solid var(--linka);
  margin-bottom: 22px;
}
.filtry-vnitrek {
  max-width: 1180px; margin: 0 auto; padding: 12px 20px;
  display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: flex-end;
}
.pole { display: flex; flex-direction: column; gap: 4px; }
.pole label {
  font-family: var(--uzke); font-size: 11px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--tlumene);
}
.pole select, .pole input[type=search] {
  font: inherit; font-size: 14px; padding: 6px 8px; background: #fff;
  border: 1px solid var(--linka); border-radius: var(--radius); color: inherit;
  min-width: 132px;
}
.pole input[type=range] { width: 148px; accent-color: var(--tabule); }
.pole .hodnota { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--inkoust); }
.prepinac { display: flex; align-items: center; gap: 7px; font-size: 14px; padding-bottom: 6px; }
.reset {
  font: inherit; font-size: 13px; background: none; border: none; cursor: pointer;
  color: var(--tlumene); text-decoration: underline; padding-bottom: 7px;
}
.reset:hover { color: var(--inkoust); }

/* --- řádek nabídky ------------------------------------------------------- */
.souhrn {
  font-family: var(--uzke); letter-spacing: .1em; text-transform: uppercase;
  font-size: 12px; color: var(--tlumene); margin: 0 0 10px;
}
.seznam { display: flex; flex-direction: column; gap: 8px; }
.radek {
  display: grid; grid-template-columns: 5px 148px 1fr auto;
  background: var(--karta); border: 1px solid var(--linka); border-radius: var(--radius);
  overflow: hidden; transition: border-color .12s, transform .12s;
}
.radek:hover { border-color: #8FA3AF; transform: translateY(-1px); }
.radek a:focus-visible { outline: 3px solid var(--jantar); outline-offset: 2px; }
.titulek a { color: inherit; text-decoration: none; }
.titulek a:hover { text-decoration: underline; }
.odkazy { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px;
          flex-wrap: wrap; }
.odkazy a {
  font-family: var(--uzke); font-size: 12px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--tlumene); text-decoration: none;
  border-bottom: 1px solid var(--linka); padding-bottom: 1px;
  min-height: 24px; display: inline-flex; align-items: center;
}
.odkazy a:hover { color: var(--inkoust); border-color: var(--inkoust); }
.rail { background: var(--barva-linky, var(--tlumene)); }
.foto { background: #DCE3E7; min-height: 108px; overflow: hidden; }
.foto img { display: block; width: 100%; height: 100%; min-height: 108px;
            object-fit: cover; }
.telo { padding: 12px 16px; min-width: 0; }
.misto {
  font-family: var(--uzke); font-size: 13px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--barva-linky, var(--tlumene)); font-weight: 700;
}
.titulek {
  margin: 2px 0 8px; font-size: 15.5px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.parametry { display: flex; flex-wrap: wrap; gap: 6px; }
.stitek {
  font-size: 12.5px; color: var(--tlumene); background: #F1F4F6;
  border: 1px solid #E1E7EA; border-radius: 2px; padding: 2px 7px;
  font-variant-numeric: tabular-nums;
}
.stitek.zdroj { background: #E8F0F4; border-color: #CFDEE6; color: #2B5468;
  font-weight: 600; }
.stitek.garaz { background: #EAF2E8; border-color: #CFE0C9; color: #3A5A32;
  font-weight: 600; }
.stitek.odhad { border-style: dashed; color: #6B7A85; }
.stitek.mhd { background: #EDEAF4; border-color: #D7CFE6; color: #46356B;
  font-weight: 600; }
.stitek.novy { background: var(--jantar); border-color: var(--jantar); color: #131B22; font-weight: 700;
  font-family: var(--uzke); letter-spacing: .1em; text-transform: uppercase; }
.pravo {
  padding: 12px 18px; text-align: right; border-left: 1px solid #EDF1F3;
  display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 186px;
}
.cena { font-family: var(--uzke); font-size: 27px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cena-m2 { font-size: 12.5px; color: var(--tlumene); font-variant-numeric: tabular-nums; }
.casy { display: flex; gap: 12px; justify-content: flex-end; margin-top: 2px; }
.cas { font-family: var(--uzke); font-size: 12px; letter-spacing: .06em; color: var(--tlumene); }
.cas b {
  font-size: 19px; color: var(--inkoust); font-variant-numeric: tabular-nums;
  letter-spacing: 0; margin-right: 1px;
}
.prazdno {
  background: var(--karta); border: 1px dashed var(--linka); border-radius: var(--radius);
  padding: 44px 24px; text-align: center; color: var(--tlumene);
}
footer { margin-top: 34px; font-size: 12.5px; color: var(--tlumene); }

/* Sbalovací filtry — na mobilu by osm ovládacích prvků zabralo celou obrazovku. */
.filtry-prepinac { display: none; }

@media (max-width: 760px) {
  .obal { padding: 0 12px 60px; }
  .tabule-vnitrek { padding: 16px 12px 14px; }
  .tabule h1 { font-size: 24px; letter-spacing: .1em; }
  .tabule .podtitul { font-size: 12px; }

  /* Linky se vejdou na jeden posuvný řádek místo tří. Bez overscroll-behavior
     přebírá vodorovné posouvání i svislé gesto a stránka se "zasekne". */
  .linky { flex-wrap: nowrap; overflow-x: auto; margin-top: 12px;
           padding-bottom: 4px; -webkit-overflow-scrolling: touch;
           overscroll-behavior-x: contain; scrollbar-width: none; }
  .linky::-webkit-scrollbar { display: none; }
  .linka-chip { flex: 0 0 auto; padding: 10px 12px; }
  .linka-chip span:nth-child(2) { max-width: 128px; overflow: hidden;
                                  text-overflow: ellipsis; white-space: nowrap; }

  /* Lišta filtrů na mobilu NEPŘILÉPÁ. Rozbalená by přes sebe přeložila
     půl obsahu a na iOS se pod ní ztrácely první nabídky. Přilepené
     zůstává jen tlačítko, které je vysoké 46 px. */
  .filtry { position: static; backdrop-filter: none; background: var(--papir); }
  .filtry-prepinac {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; min-height: 48px; padding: 12px; cursor: pointer;
    background: var(--papir); border: none; border-bottom: 1px solid var(--linka);
    color: inherit; font: inherit; font-family: var(--uzke); font-size: 15px;
    letter-spacing: .12em; text-transform: uppercase;
    position: sticky; top: 0; z-index: 30;
  }
  .filtry-vnitrek { padding: 12px 12px 16px; gap: 14px 14px;
                    border-bottom: 1px solid var(--linka); }
  .filtry-vnitrek[hidden] { display: none; }

  .pole { flex: 1 1 46%; gap: 6px; }
  /* iOS přibližuje stránku, když má pole písmo menší než 16 px. */
  .pole select, .pole input[type=search] {
    width: 100%; min-width: 0; min-height: 44px; font-size: 16px;
  }
  .pole input[type=range] { width: 100%; min-height: 40px; }
  .pole label { font-size: 12px; }
  .prepinac { flex: 1 1 100%; min-height: 44px; padding-bottom: 0; font-size: 15px; }
  .prepinac input { width: 22px; height: 22px; }
  .reset { flex: 1 1 100%; text-align: left; padding: 8px 0 0; min-height: 40px;
           font-size: 15px; }

  /* Fotka nad textem místo vedle něj — na mobilu je fotka to hlavní. */
  .radek {
    grid-template-columns: 5px 1fr;
    grid-template-areas: "rail foto" "rail telo" "rail pravo";
  }
  .radek:hover { transform: none; }
  .rail  { grid-area: rail; }
  .foto  { grid-area: foto; height: 190px; min-height: 0; }
  .foto img { height: 190px; }
  .telo  { grid-area: telo; padding: 12px 14px 10px; }
  .pravo {
    grid-area: pravo; min-width: 0; padding: 0 14px 14px;
    border-left: none; text-align: left;
    flex-direction: row; flex-wrap: wrap; justify-content: space-between;
    align-items: baseline; gap: 4px 12px;
  }
  .cena { font-size: 25px; }
  .casy { justify-content: flex-start; margin-top: 0; }
  .odkazy { justify-content: flex-start; width: 100%; }
  .odkazy a { min-height: 40px; }
  .titulek { white-space: normal; }
  .souhrn { margin: 12px 0 10px; }
}

@media (max-width: 420px) {
  .pole, .prepinac { flex: 1 1 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="tabule">
  <div class="tabule-vnitrek">
    <h1>Bydlení v dojezdu Brna</h1>
    <p class="podtitul">Aktualizováno 6. 9. 2026 v 18:30 &middot; 398 nabídek &middot; <b id="nove-souhrn">0 nových od minula</b></p>
    <div class="linky" id="linky"></div>
  </div>
</header>

<div class="filtry">
  <button class="filtry-prepinac" id="filtry-prepinac" aria-expanded="false"
          aria-controls="filtry-vnitrek">
    <span>Filtry <span id="filtry-pocet"></span></span>
    <span class="znacka" id="filtry-znacka">Zobrazit</span>
  </button>
  <div class="filtry-vnitrek" id="filtry-vnitrek">
    <div class="pole">
      <label for="f-zdroj">Zdroj</label>
      <select id="f-zdroj"><option value="">Všechny weby</option></select>
    </div>
    <div class="pole">
      <label for="f-typ">Typ</label>
      <select id="f-typ">
        <option value="">Domy i byty</option>
        <option value="dum">Rodinné domy</option>
        <option value="byt">Byty</option>
      </select>
    </div>
    <div class="pole">
      <label for="f-obec">Obec</label>
      <select id="f-obec"><option value="">Všechny obce</option></select>
    </div>
    <div class="pole">
      <label for="f-cena-od">Cena od <span class="hodnota" id="v-cena-od"></span></label>
      <input type="range" id="f-cena-od" min="6000000" max="11000000"
             step="100000" value="6000000">
    </div>
    <div class="pole">
      <label for="f-cena">Cena do <span class="hodnota" id="v-cena"></span></label>
      <input type="range" id="f-cena" min="6000000" max="11000000"
             step="100000" value="11000000">
    </div>
    <div class="pole">
      <label for="f-plocha">Plocha od <span class="hodnota" id="v-plocha"></span></label>
      <input type="range" id="f-plocha" min="0" max="250" step="5" value="0">
    </div>
    <div class="pole">
      <label for="f-pozemek">Pozemek od <span class="hodnota" id="v-pozemek"></span></label>
      <input type="range" id="f-pozemek" min="0" max="1500" step="50" value="0">
    </div>
    <div class="pole">
      <label for="f-auto">Autem do centra Brna <span class="hodnota" id="v-auto"></span></label>
      <input type="range" id="f-auto" min="10" max="35" step="1" value="35">
    </div>
    <div class="pole">
      <label for="f-nadrazi">Pěšky na nádraží <span class="hodnota" id="v-nadrazi"></span></label>
      <input type="range" id="f-nadrazi" min="200" max="3000" step="100" value="3000">
    </div>
    <div class="pole">
      <label for="f-mhd-real">MHD na FF MU (jízdní řád) <span class="hodnota" id="v-mhd-real"></span></label>
      <input type="range" id="f-mhd-real" min="10" max="90" step="1" value="90">
    </div>
    <div class="pole">
      <label for="f-mhd">MHD na FF MU (hrubý odhad) <span class="hodnota" id="v-mhd"></span></label>
      <input type="range" id="f-mhd" min="15" max="50" step="1" value="50">
    </div>
    <div class="pole">
      <label for="f-razeni">Řadit podle</label>
      <select id="f-razeni">
        <option value="cena">Nejnižší ceny</option>
        <option value="cena_m2">Ceny za m²</option>
        <option value="vlakem">Nejkratší cesty vlakem</option>
        <option value="vlak_m">Pěší vzdálenosti k nádraží</option>
        <option value="auto_min">Nejkratší cesty autem na FF MU</option>
        <option value="mhd_min">Nejkratší cesty MHD (jízdní řád)</option>
        <option value="mhd_cil">Nejkratší cesty MHD (hrubý odhad)</option>
        <option value="km_cil">Vzdálenosti od FF MU</option>
        <option value="autem">Nejkratší cesty autem do centra</option>
        <option value="plocha">Největší plochy</option>
        <option value="pozemek">Největšího pozemku</option>
        <option value="nove">Data přidání</option>
      </select>
    </div>
    <div class="pole">
      <label for="f-hledat">Hledat v textu</label>
      <input type="search" id="f-hledat" placeholder="např. zahrada, garáž">
    </div>
    <label class="prepinac"><input type="checkbox" id="f-vlak"> Jen s vlakem</label>
    <label class="prepinac"><input type="checkbox" id="f-garaz"> Jen s garáží nebo stáním</label>
    <label class="prepinac"><input type="checkbox" id="f-nove"> Jen nové pro mě</label>
    <button class="reset" id="reset">Zrušit filtry</button>
  </div>
</div>

<main class="obal">
  <p class="souhrn" id="souhrn"></p>
  <div class="seznam" id="seznam"></div>
</main>

<div class="obal">
  <footer>
    Data: Sreality.cz, staženo 6. 9. 2026 v 18:30. Časy dojezdu do Brna jsou orientační
    (auto mimo špičku, vlak do nejbližšího brněnského uzlu) a nastavují se
    v tabulce <code>OBCE</code> ve skriptu.

<script>
const NABIDKY = JSON.parse(document.getElementById('data').textContent);
const LINKY = JSON.parse(document.getElementById('linky-data').textContent);
const CIL = "FF MU";

/* "Nové" podle prohlížeče, ne podle běhu skriptu.
   Skript označí za nové to, co přibylo od jeho minulého běhu — při třech
   bězích denně to pro člověka, který se dívá jednou za dva dny, nic neříká.
   Prohlížeč si proto pamatuje, co už tady bylo vidět, a "nové" znamená
   "od mé poslední návštěvy". Každé zařízení zvlášť. */
(function noveOdMinuleNavstevy() {
  const KLIC = 'reality-brno:videne';
  const NAVSTEVA_MS = 30 * 60 * 1000;   // reload do půl hodiny je táž návštěva
  const ted = Date.now();
  const aktualni = NABIDKY.map(n => n.id);

  let ulozene = null;
  try { ulozene = JSON.parse(localStorage.getItem(KLIC)); } catch (e) {}
  if (ulozene && !Array.isArray(ulozene.ids)) ulozene = null;

  let nove, minulaNavsteva;
  if (!ulozene) {
    // První návštěva na tomhle zařízení: převzít, co označil skript.
    nove = new Set(NABIDKY.filter(n => n.nove).map(n => n.id));
    minulaNavsteva = null;
  } else if (ted - ulozene.cas < NAVSTEVA_MS) {
    // Reload během prohlížení nesmí štítky shodit.
    nove = new Set(ulozene.nove || []);
    minulaNavsteva = ulozene.minulaNavsteva;
  } else {
    const videne = new Set(ulozene.ids);
    nove = new Set(aktualni.filter(id => !videne.has(id)));
    minulaNavsteva = ulozene.cas;
  }

  NABIDKY.forEach(n => n.nove = nove.has(n.id));

  const ids = ulozene ? [...new Set([...ulozene.ids, ...aktualni])].slice(-3000) : aktualni;
  try {
    localStorage.setItem(KLIC, JSON.stringify(
      { ids, cas: ted, nove: [...nove], minulaNavsteva }));
  } catch (e) {}   // soukromý režim apod. — funguje to i bez ukládání

  function pred(ms) {
    const min = Math.round(ms / 60000);
    if (min < 60) return 'před ' + min + ' min';
    const h = Math.round(min / 60);
    if (h < 24) return 'před ' + h + (h === 1 ? ' hodinou' : h < 5 ? ' hodinami' : ' hodinami');
    const d = Math.round(h / 24);
    return d === 1 ? 'včera' : 'před ' + d + (d < 5 ? ' dny' : ' dny');
  }
  const souhrn = document.getElementById('nove-souhrn');
  if (!ulozene) {
    souhrn.textContent = nove.size + ' nových od minulého běhu';
  } else {
    souhrn.textContent = nove.size + ' nových pro vás'
      + (minulaNavsteva ? ' (naposledy ' + pred(ted - minulaNavsteva) + ')' : '');
  }
})();
const aktivniLinky = new Set();

const kc = n => n.toLocaleString('cs-CZ') + ' Kč';
const metry = m => m >= 1000 ? (m / 1000).toFixed(1).replace('.', ',') + ' km' : m + ' m';
const el = id => document.getElementById(id);

/* Přehled linek v hlavičce, zároveň slouží jako filtr. */
(function vykresliLinky() {
  const pocty = {};
  NABIDKY.forEach(n => pocty[n.linka] = (pocty[n.linka] || 0) + 1);
  const box = el('linky');
  Object.entries(LINKY).forEach(([klic, info]) => {
    if (!pocty[klic]) return;
    const tlacitko = document.createElement('button');
    tlacitko.className = 'linka-chip';
    tlacitko.setAttribute('aria-pressed', 'false');
    tlacitko.title = info.popis;
    tlacitko.innerHTML = '<span class="tecka" style="background:' + info.barva + '"></span>'
      + '<span>' + info.popis + '</span>'
      + '<span class="pocet">' + pocty[klic] + '</span>';
    tlacitko.onclick = () => {
      aktivniLinky.has(klic) ? aktivniLinky.delete(klic) : aktivniLinky.add(klic);
      tlacitko.setAttribute('aria-pressed', aktivniLinky.has(klic));
      vykresli();
    };
    box.appendChild(tlacitko);
  });
})();

/* Nabídka zdrojů. */
(function naplnZdroje() {
  const pocty = {};
  NABIDKY.forEach(n => (n.zdroje || [n.zdroj]).forEach(
    z => pocty[z] = (pocty[z] || 0) + 1));
  const vyber = el('f-zdroj');
  Object.entries(pocty).sort((a, b) => b[1] - a[1]).forEach(([zdroj, pocet]) => {
    const volba = document.createElement('option');
    volba.value = zdroj;
    volba.textContent = zdroj + ' (' + pocet + ')';
    vyber.appendChild(volba);
  });
  if (Object.keys(pocty).length < 2) vyber.closest('.pole').hidden = true;
})();

/* Rozsahy jezdců se odvodí z dat. Napevno zadané meze by měly hluchá
   pásma — jezdec by šel posouvat, aniž by se cokoli filtrovalo. */
function nastavJezdec(id, hodnoty, rezim) {
  const prvek = el(id);
  const cisla = hodnoty.filter(v => typeof v === 'number' && isFinite(v));
  if (!cisla.length) {
    prvek.dataset.vypnuto = '1';
    prvek.closest('.pole').hidden = true;
    return;
  }
  const krok = +prvek.step || 1;
  let min = Math.floor(Math.min(...cisla) / krok) * krok;
  let max = Math.ceil(Math.max(...cisla) / krok) * krok;
  if (min === max) { min = Math.max(0, min - krok); max = max + krok; }
  prvek.min = min;
  prvek.max = max;
  prvek.value = rezim === 'od' ? min : max;
}

/* Jezdec na krajní poloze znamená "neomezovat". */
function volny(id, rezim) {
  const prvek = el(id);
  if (prvek.dataset.vypnuto) return true;
  return rezim === 'od' ? +prvek.value <= +prvek.min : +prvek.value >= +prvek.max;
}

(function nastavRozsahy() {
  const hodnoty = klic => NABIDKY.map(n => n[klic]);
  nastavJezdec('f-cena-od', hodnoty('cena'), 'od');
  nastavJezdec('f-cena', hodnoty('cena'), 'do');
  nastavJezdec('f-plocha', hodnoty('plocha'), 'od');
  nastavJezdec('f-pozemek', hodnoty('pozemek'), 'od');
  nastavJezdec('f-auto', hodnoty('autem'), 'do');
  nastavJezdec('f-nadrazi', hodnoty('vlak_m'), 'do');
  nastavJezdec('f-mhd-real', hodnoty('mhd_min'), 'do');
  nastavJezdec('f-mhd', hodnoty('mhd_cil'), 'do');
  // Odhad schovat jen tehdy, když skutečné časy pokrývají skoro všechno.
  // Při částečném pokrytí by se filtrování zbytku nabídek ztratilo.
  const sJizdnimRadem = NABIDKY.filter(n => typeof n.mhd_min === 'number').length;
  if (sJizdnimRadem >= NABIDKY.length * 0.9) {
    el('f-mhd').closest('.pole').hidden = true;
  }
})();

/* Nabídka obcí, seřazená podle četnosti. */
(function naplnObce() {
  const pocty = {};
  NABIDKY.forEach(n => pocty[n.obec] = (pocty[n.obec] || 0) + 1);
  Object.entries(pocty).sort((a, b) => b[1] - a[1]).forEach(([obec, pocet]) => {
    const volba = document.createElement('option');
    volba.value = obec;
    volba.textContent = obec + ' (' + pocet + ')';
    el('f-obec').appendChild(volba);
  });
})();

function radekHtml(n) {
  const barva = (LINKY[n.linka] || {}).barva || '#6B7A85';
  const stitky = [];
  if (n.nove) stitky.push('<span class="stitek novy">Nové pro vás</span>');
  if ((n.zdroje || []).length > 1) stitky.push('<span class="stitek zdroj">Na obou webech</span>');
  else if (n.zdroj === 'Bezrealitky') stitky.push('<span class="stitek zdroj">Bez provize</span>');
  if (n.garaz) stitky.push('<span class="stitek garaz">Garáž / stání</span>');
  if (n.dispozice) stitky.push('<span class="stitek">' + n.dispozice + '</span>');
  if (n.plocha) stitky.push('<span class="stitek">' + n.plocha + ' m² užitná</span>');
  if (n.pozemek) stitky.push('<span class="stitek">pozemek ' + n.pozemek + ' m²</span>');
  if (n.vlak_m) stitky.push('<span class="stitek">nádraží ' + metry(n.vlak_m) + '</span>');
  if (n.obchod_m) stitky.push('<span class="stitek">obchod ' + metry(n.obchod_m) + '</span>');
  if (n.skola_m) stitky.push('<span class="stitek">škola ' + metry(n.skola_m) + '</span>');
  if (n.auto_km) stitky.push('<span class="stitek">' + CIL + ' '
    + String(n.auto_km).replace('.', ',') + ' km po silnici</span>');
  else if (n.km_cil) stitky.push('<span class="stitek">' + CIL + ' '
    + String(n.km_cil).replace('.', ',') + ' km vzdušnou čarou</span>');
  if (n.mhd_min) stitky.push('<span class="stitek mhd">' + n.mhd_min
    + ' min MHD z domu</span>');
  else if (n.mhd_cil) stitky.push('<span class="stitek odhad">~' + n.mhd_cil + ' min MHD (odhad)</span>');

  const casy = [];
  if (n.auto_min) casy.push('<span class="cas"><b>' + n.auto_min + '</b>′ autem na ' + CIL + '</span>');
  else if (n.autem) casy.push('<span class="cas"><b>' + n.autem + '</b>′ autem do centra</span>');
  if (n.mhd_min) casy.push('<span class="cas"><b>' + n.mhd_min + '</b>′ MHD</span>');
  else if (n.pesky_min) casy.push('<span class="cas"><b>' + n.pesky_min + '</b>′ pěšky</span>');
  else if (n.vlakem) casy.push('<span class="cas"><b>' + n.vlakem + '</b>′ vlakem</span>');

  const odkazy = [];
  if (n.trasa_auto) odkazy.push('<a href="' + n.trasa_auto
    + '" target="_blank" rel="noopener">Trasa autem</a>');
  if (n.trasa_mhd) odkazy.push('<a href="' + n.trasa_mhd
    + '" target="_blank" rel="noopener">Spojení MHD</a>');

  return '<div class="radek" style="--barva-linky:' + barva + '">'
    + '<div class="rail"></div>'
    + '<a class="foto" href="' + n.url + '" target="_blank" rel="noopener">'
    +   (n.obrazek
        ? '<img src="' + n.obrazek + '" alt="" loading="lazy" '
          + 'referrerpolicy="no-referrer" onerror="this.remove()">'
        : '') + '</a>'
    + '<div class="telo">'
    +   '<div class="misto">' + n.obec + '</div>'
    +   '<div class="titulek"><a href="' + n.url + '" target="_blank" '
    +     'rel="noopener">' + n.nazev + '</a></div>'
    +   '<div class="parametry">' + stitky.join('') + '</div>'
    + '</div>'
    + '<div class="pravo">'
    +   '<div class="cena">' + kc(n.cena) + '</div>'
    +   (n.cena_m2 ? '<div class="cena-m2">' + kc(n.cena_m2) + ' / m²</div>' : '')
    +   '<div class="casy">' + casy.join('') + '</div>'
    +   '<div class="odkazy">' + odkazy.join('') + '</div>'
    + '</div>'
    + '</div>';
}

function vykresli() {
  const typ = el('f-typ').value;
  const zdroj = el('f-zdroj').value;
  const obec = el('f-obec').value;
  let minCena = +el('f-cena-od').value;
  const maxCena = +el('f-cena').value;
  // Spodní hranice nesmí přeskočit horní.
  if (minCena > maxCena) { minCena = maxCena; el('f-cena-od').value = minCena; }
  const minPlocha = +el('f-plocha').value;
  const minPozemek = +el('f-pozemek').value;
  const maxAuto = +el('f-auto').value;
  const maxNadrazi = +el('f-nadrazi').value;
  const maxMhd = +el('f-mhd').value;
  const maxMhdReal = +el('f-mhd-real').value;
  const jenGaraz = el('f-garaz').checked;
  const jenVlak = el('f-vlak').checked;
  const jenNove = el('f-nove').checked;
  const hledat = el('f-hledat').value.trim().toLowerCase();
  const razeni = el('f-razeni').value;

  const mil = c => (c / 1e6).toFixed(2).replace('.', ',') + ' mil.';
  const bezPlochy = volny('f-plocha', 'od');
  const bezPozemku = volny('f-pozemek', 'od');
  const bezAuta = volny('f-auto', 'do');
  const bezNadrazi = volny('f-nadrazi', 'do');
  const bezMhd = volny('f-mhd', 'do');
  const bezMhdReal = volny('f-mhd-real', 'do');

  el('v-cena').textContent = mil(maxCena);
  el('v-cena-od').textContent = mil(minCena);
  el('v-plocha').textContent = bezPlochy ? 'bez omezení' : minPlocha + ' m²';
  el('v-pozemek').textContent = bezPozemku ? 'bez omezení' : minPozemek + ' m²';
  el('v-auto').textContent = bezAuta ? 'bez omezení' : 'do ' + maxAuto + ' min';
  el('v-nadrazi').textContent = bezNadrazi ? 'bez omezení' : 'do ' + metry(maxNadrazi);
  el('v-mhd').textContent = bezMhd ? 'bez omezení' : 'do ' + maxMhd + ' min';
  el('v-mhd-real').textContent = bezMhdReal ? 'bez omezení' : 'do ' + maxMhdReal + ' min';

  let vybrane = NABIDKY.filter(n =>
    (!typ || n.typ === typ) &&
    (!zdroj || (n.zdroje || [n.zdroj]).includes(zdroj)) &&
    (!obec || n.obec === obec) &&
    (!aktivniLinky.size || aktivniLinky.has(n.linka)) &&
    n.cena >= minCena && n.cena <= maxCena &&
    (bezPlochy || (n.plocha || 0) >= minPlocha) &&
    (bezPozemku || (n.pozemek || 0) >= minPozemek) &&
    (bezAuta || (n.autem && n.autem <= maxAuto)) &&
    (bezNadrazi || (n.vlak_m && n.vlak_m <= maxNadrazi)) &&
    (bezMhd || (n.mhd_cil && n.mhd_cil <= maxMhd)) &&
    (bezMhdReal || (n.mhd_min && n.mhd_min <= maxMhdReal)) &&
    (!jenGaraz || n.garaz === true) &&
    (!jenVlak || n.vlakem) &&
    (!jenNove || n.nove) &&
    (!hledat || (n.nazev + ' ' + n.lokalita).toLowerCase().includes(hledat))
  );

  const konec = 1e12;
  const klice = {
    cena:     n => n.cena,
    cena_m2:  n => n.cena_m2 || konec,
    vlakem:   n => n.vlakem || konec,
    vlak_m:   n => n.vlak_m || konec,
    auto_min: n => n.auto_min || konec,
    mhd_min:  n => n.mhd_min || konec,
    mhd_cil:  n => n.mhd_cil || konec,
    km_cil:   n => n.km_cil || konec,
    autem:    n => n.autem || konec,
    plocha:   n => -(n.plocha || 0),
    pozemek:  n => -(n.pozemek || 0),
    nove:     n => (n.nove ? 0 : 1) + '' + n.poprve,
  };
  const klic = klice[razeni];
  vybrane.sort((a, b) => klic(a) > klic(b) ? 1 : klic(a) < klic(b) ? -1 : 0);

  const aktivnich = [
    typ, zdroj, obec, hledat, jenVlak, jenNove, jenGaraz,
    aktivniLinky.size,
    !volny('f-cena-od', 'od'), !volny('f-cena', 'do'),
    !bezPlochy, !bezPozemku, !bezAuta, !bezNadrazi, !bezMhd, !bezMhdReal,
  ].filter(Boolean).length;
  const znacka = el('filtry-pocet');
  znacka.textContent = aktivnich;
  znacka.classList.toggle('aktivni', aktivnich > 0);

  el('souhrn').textContent = vybrane.length
    ? vybrane.length + ' z ' + NABIDKY.length + ' nabídek odpovídá filtrům'
    : '';
  el('seznam').innerHTML = vybrane.length
    ? vybrane.map(radekHtml).join('')
    : '<div class="prazdno">Filtrům neodpovídá žádná nabídka. Zkus zvednout cenový strop nebo povolit delší dojezd.</div>';
}

document.querySelectorAll('.filtry input, .filtry select').forEach(prvek => {
  prvek.addEventListener('input', vykresli);
});
el('reset').onclick = () => {
  el('f-typ').value = ''; el('f-obec').value = ''; el('f-razeni').value = 'cena';
  el('f-zdroj').value = '';
  [['f-cena-od', 'od'], ['f-cena', 'do'], ['f-plocha', 'od'],
   ['f-pozemek', 'od'], ['f-auto', 'do'], ['f-nadrazi', 'do'],
   ['f-mhd', 'do'], ['f-mhd-real', 'do']].forEach(([id, rezim]) => {
    el(id).value = rezim === 'od' ? el(id).min : el(id).max;
  });
  el('f-garaz').checked = false;
  el('f-vlak').checked = false; el('f-nove').checked = false; el('f-hledat').value = '';
  aktivniLinky.clear();
  document.querySelectorAll('.linka-chip').forEach(t => t.setAttribute('aria-pressed', 'false'));
  vykresli();
};

/* Filtry se na úzkém displeji sbalí, jinak zůstávají otevřené. */
(function sbalovaniFiltru() {
  const panel = el('filtry-vnitrek');
  const tlacitko = el('filtry-prepinac');
  const znacka = el('filtry-znacka');
  const uzko = window.matchMedia('(max-width: 760px)');

  function nastav(otevreno) {
    panel.hidden = !otevreno;
    tlacitko.setAttribute('aria-expanded', otevreno);
    znacka.textContent = otevreno ? 'Skrýt' : 'Zobrazit';
  }
  function podleSirky() { nastav(!uzko.matches); }

  tlacitko.onclick = () => nastav(panel.hidden);
  uzko.addEventListener('change', podleSirky);
  podleSirky();
})();

vykresli();
</script>
</body>
</html>
