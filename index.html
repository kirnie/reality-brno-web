<title>Bydlení v dojezdu Brna</title>
<style>
:root {
  --pozadi: #F4F5F7;
  --plocha: #FFFFFF;
  --plocha-2: #F1F3F6;
  --text: #111827;
  --tlumene: #6B7280;
  --okraj: #E5E7EB;
  --okraj-silny: #D1D5DB;
  --akcent: #0F766E;
  --akcent-text: #FFFFFF;
  --akcent-mekky: #E6F4F1;
  --novy: #F5B82E;
  --novy-text: #3B2A00;
  --stin: 0 1px 2px rgba(17,24,39,.04), 0 1px 3px rgba(17,24,39,.06);
  --stin-zvednuty: 0 10px 30px -12px rgba(17,24,39,.25);
  --r-velky: 16px;
  --r: 10px;
  --r-maly: 999px;
  --pismo: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
           "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pozadi: #0D1117;
    --plocha: #161B22;
    --plocha-2: #1C232C;
    --text: #E6EDF3;
    --tlumene: #8B97A5;
    --okraj: #242C36;
    --okraj-silny: #313B47;
    --akcent: #2DD4BF;
    --akcent-text: #04201C;
    --akcent-mekky: #0F2A27;
    --novy: #F5B82E;
    --novy-text: #2A1E00;
    --stin: 0 1px 2px rgba(0,0,0,.3);
    --stin-zvednuty: 0 12px 32px -12px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --pozadi: #0D1117;
  --plocha: #161B22;
  --plocha-2: #1C232C;
  --text: #E6EDF3;
  --tlumene: #8B97A5;
  --okraj: #242C36;
  --okraj-silny: #313B47;
  --akcent: #2DD4BF;
  --akcent-text: #04201C;
  --akcent-mekky: #0F2A27;
  --novy: #F5B82E;
  --novy-text: #2A1E00;
  --stin: 0 1px 2px rgba(0,0,0,.3);
  --stin-zvednuty: 0 12px 32px -12px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* Atribut hidden dává display:none, ale prohrává s explicitním display
   u .pole a podobných. Bez tohohle se prázdné filtry neskryjí. */
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--pozadi); color: var(--text);
  font-family: var(--pismo); font-size: 15px; line-height: 1.5;
  -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased;
}
button, select, input, a { -webkit-tap-highlight-color: transparent; }
button, .linka-chip, .odkazy a { touch-action: manipulation; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--akcent); outline-offset: 2px; }
.obal { max-width: 1280px; margin: 0 auto; padding: 0 24px 80px; }
.cisla { font-variant-numeric: tabular-nums; }

/* --- hlavička ------------------------------------------------------------ */
.hlavicka { max-width: 1280px; margin: 0 auto; padding: 36px 24px 8px; }
.hlavicka-radek { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.hlavicka h1 {
  margin: 0; font-size: 30px; font-weight: 750; letter-spacing: -.025em; line-height: 1.15;
}
.podtitul { margin: 6px 0 0; color: var(--tlumene); font-size: 14px; }
.podtitul b {
  display: inline-block; font-weight: 600; color: var(--novy-text);
  background: var(--novy); border-radius: var(--r-maly); padding: 1px 9px; margin-left: 2px;
}
.vzhled {
  flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center;
  border: 1px solid var(--okraj); background: var(--plocha); color: var(--tlumene);
  border-radius: var(--r-maly); cursor: pointer; box-shadow: var(--stin);
}
.vzhled:hover { color: var(--text); border-color: var(--okraj-silny); }
.vzhled svg { width: 18px; height: 18px; }
.vzhled .mesic { display: none; }
:root[data-theme="dark"] .vzhled .slunce { display: none; }
:root[data-theme="dark"] .vzhled .mesic { display: block; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .vzhled .slunce { display: none; }
  :root:not([data-theme="light"]) .vzhled .mesic { display: block; }
}

.linky { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.linka-chip {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  background: var(--plocha); border: 1px solid var(--okraj); border-radius: var(--r-maly);
  padding: 6px 12px 6px 10px; color: var(--text); font: inherit; font-size: 13px;
  font-weight: 500; box-shadow: var(--stin);
  transition: background .15s, border-color .15s, color .15s;
}
.linka-chip:hover { border-color: var(--okraj-silny); }
.linka-chip[aria-pressed="true"] {
  background: var(--text); color: var(--pozadi); border-color: var(--text);
}
.linka-chip .pocet {
  font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 600;
  color: var(--tlumene); background: var(--plocha-2); border-radius: var(--r-maly);
  padding: 0 7px; min-width: 22px; text-align: center;
}
.linka-chip[aria-pressed="true"] .pocet { background: rgba(127,127,127,.25); color: inherit; }
.linka-chip .tecka { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto;
  box-shadow: 0 0 0 2px var(--plocha); }

/* --- filtry -------------------------------------------------------------- */
.filtry {
  position: sticky; top: 0; z-index: 20; margin: 16px 0 24px;
  background: color-mix(in srgb, var(--pozadi) 82%, transparent);
  backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--okraj);
}
.filtry-vnitrek {
  max-width: 1280px; margin: 0 auto; padding: 14px 24px;
  display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end;
}
.pole { display: flex; flex-direction: column; gap: 5px; }
.pole label { font-size: 12px; font-weight: 500; color: var(--tlumene); white-space: nowrap; }
.pole select, .pole input[type=search] {
  font: inherit; font-size: 14px; padding: 7px 10px; min-height: 36px;
  background: var(--plocha); color: inherit; min-width: 140px;
  border: 1px solid var(--okraj); border-radius: var(--r); box-shadow: var(--stin);
}
.pole select:hover, .pole input[type=search]:hover { border-color: var(--okraj-silny); }
.pole input[type=range] { width: 150px; accent-color: var(--akcent); margin: 4px 0; }
.pole .hodnota { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; margin-left: 4px; }
.prepinac {
  display: inline-flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer;
  padding: 7px 12px; min-height: 36px; border-radius: var(--r-maly);
  border: 1px solid var(--okraj); background: var(--plocha); box-shadow: var(--stin);
}
.prepinac:has(input:checked) { border-color: var(--akcent); background: var(--akcent-mekky); }
.prepinac input { accent-color: var(--akcent); margin: 0; }
.reset {
  font: inherit; font-size: 14px; background: none; border: none; cursor: pointer;
  color: var(--akcent); font-weight: 600; padding: 8px 4px; min-height: 36px;
}
.reset:hover { text-decoration: underline; }

/* --- karty nabídek ------------------------------------------------------- */
.lista {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 10px 16px; margin: 0 0 16px;
}
.souhrn { font-size: 14px; color: var(--tlumene); margin: 0; }
.razeni { display: inline-flex; align-items: center; gap: 10px; font-size: 14px;
          color: var(--tlumene); }
.razeni span { white-space: nowrap; }
.razeni select {
  font: inherit; font-size: 14px; font-weight: 600; color: var(--text);
  padding: 7px 10px; min-height: 38px; background: var(--plocha);
  border: 1px solid var(--okraj); border-radius: var(--r); box-shadow: var(--stin);
  cursor: pointer;
}
.razeni select:hover { border-color: var(--okraj-silny); }
.razeni .smer {
  font: inherit; font-size: 14px; font-weight: 600; color: var(--text);
  padding: 7px 10px; min-height: 38px; background: var(--plocha);
  border: 1px solid var(--okraj); border-radius: var(--r); box-shadow: var(--stin);
  cursor: pointer; white-space: nowrap;
}
.razeni .smer:hover { border-color: var(--okraj-silny); }
.seznam {
  display: grid; gap: 20px;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
}
.karta {
  position: relative; display: flex; flex-direction: column; min-width: 0;
  background: var(--plocha); border: 1px solid var(--okraj);
  border-radius: var(--r-velky); overflow: hidden; box-shadow: var(--stin);
  transition: box-shadow .2s, transform .2s, border-color .2s;
}
@media (hover: hover) {
  .karta:hover { box-shadow: var(--stin-zvednuty); transform: translateY(-2px);
                 border-color: var(--okraj-silny); }
  .karta:hover .foto img { transform: scale(1.03); }
}
.foto {
  position: relative; display: block; aspect-ratio: 16 / 10; overflow: hidden;
  background: linear-gradient(135deg, var(--plocha-2), var(--okraj));
}
.foto img { display: block; width: 100%; height: 100%; object-fit: cover;
            transition: transform .4s ease; }
.foto-prazdna { position: absolute; inset: 0; display: grid; place-items: center; color: var(--tlumene); }
.foto-prazdna svg { width: 34px; height: 34px; opacity: .6; }
.odznaky { position: absolute; top: 12px; left: 12px; right: 12px;
           display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
.odznak {
  font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: var(--r-maly);
  background: rgba(255,255,255,.92); color: #111827;
  box-shadow: 0 1px 3px rgba(0,0,0,.15);
}
.odznak.novy { background: var(--novy); color: var(--novy-text); }
.odznak.linka { margin-left: auto; color: #fff; background: var(--barva-linky); }

.telo { display: flex; flex-direction: column; gap: 10px; padding: 16px 18px 18px; flex: 1; }
.misto { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600;
         color: var(--tlumene); min-width: 0; }
.misto .tecka { width: 8px; height: 8px; border-radius: 50%; background: var(--barva-linky); flex: 0 0 auto; }
.misto span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titulek {
  margin: -4px 0 0; font-size: 16px; font-weight: 600; line-height: 1.35; letter-spacing: -.01em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.titulek a { text-decoration: none; }
.titulek a::after { content: ""; position: absolute; inset: 0; z-index: 1; }
.titulek a:hover { text-decoration: underline; text-underline-offset: 2px; }
.cena-radek { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.cena { font-size: 24px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.cena-m2 { font-size: 13px; color: var(--tlumene); font-variant-numeric: tabular-nums; }
.parametry { display: flex; flex-wrap: wrap; gap: 6px; }
.stitek {
  font-size: 12.5px; color: var(--text); background: var(--plocha-2);
  border-radius: 8px; padding: 3px 9px; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.stitek.tlumeny { color: var(--tlumene); }
.stitek.garaz { background: var(--akcent-mekky); color: var(--akcent); font-weight: 600; }
.stitek.odhad { background: none; border: 1px dashed var(--okraj-silny); color: var(--tlumene); }
.casy {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px;
  margin-top: auto; padding-top: 12px; border-top: 1px solid var(--okraj);
}
.cas { display: flex; align-items: center; gap: 8px; color: var(--tlumene); font-size: 12px; line-height: 1.2; }
.cas svg { width: 18px; height: 18px; flex: 0 0 auto; }
.cas b { display: block; color: var(--text); font-size: 15px; font-weight: 700;
         font-variant-numeric: tabular-nums; }
.cas.odhad b { font-weight: 600; color: var(--tlumene); }
.odkazy { position: relative; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; }
.odkazy a {
  flex: 1 1 auto; text-align: center; font-size: 13px; font-weight: 600; text-decoration: none;
  padding: 7px 12px; border-radius: var(--r); border: 1px solid var(--okraj); color: var(--text);
  min-height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.odkazy a:hover { border-color: var(--akcent); color: var(--akcent); }
.prazdno {
  grid-column: 1 / -1; background: var(--plocha); border: 1px dashed var(--okraj-silny);
  border-radius: var(--r-velky); padding: 56px 24px; text-align: center; color: var(--tlumene);
}
footer { margin-top: 40px; font-size: 13px; color: var(--tlumene); }
footer code { font-size: 12px; background: var(--plocha-2); padding: 1px 5px; border-radius: 5px; }

/* Sbalovací filtry — na mobilu by ovládací prvky zabraly celou obrazovku. */
.filtry-prepinac { display: none; }
#filtry-pocet:not(.aktivni) { display: none; }
#filtry-pocet {
  display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px;
  margin-left: 6px; border-radius: var(--r-maly); background: var(--akcent);
  color: var(--akcent-text); font-size: 12px; font-weight: 700;
}

@media (max-width: 760px) {
  .obal { padding: 0 14px 60px; }
  .hlavicka { padding: 22px 14px 4px; }
  .hlavicka h1 { font-size: 24px; }
  .podtitul { font-size: 13px; }

  /* Linky se vejdou na jeden posuvný řádek. Bez overscroll-behavior
     přebírá vodorovné posouvání i svislé gesto a stránka se "zasekne". */
  .linky { flex-wrap: nowrap; overflow-x: auto; margin: 16px -14px 0; padding: 2px 14px 6px;
           -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
           scrollbar-width: none; }
  .linky::-webkit-scrollbar { display: none; }
  .linka-chip { flex: 0 0 auto; min-height: 40px; }
  .linka-chip span:nth-child(2) { max-width: 150px; overflow: hidden;
                                  text-overflow: ellipsis; white-space: nowrap; }

  /* Lišta filtrů na mobilu NEPŘILÉPÁ. Rozbalená by přes sebe přeložila
     půl obsahu. Přilepené zůstává jen tlačítko. Bez rozostření — na iOS
     trhalo posouvání. */
  .filtry { position: static; backdrop-filter: none; -webkit-backdrop-filter: none;
            background: var(--pozadi); margin: 12px 0 16px; }
  .filtry-prepinac {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; min-height: 50px; padding: 12px 14px; cursor: pointer;
    background: var(--pozadi); border: none; border-bottom: 1px solid var(--okraj);
    color: inherit; font: inherit; font-size: 15px; font-weight: 600;
    position: sticky; top: 0; z-index: 30;
  }
  .filtry-prepinac .znacka { color: var(--akcent); font-weight: 600; }
  .filtry-vnitrek { padding: 14px 14px 18px; gap: 14px 12px; }

  .pole { flex: 1 1 46%; min-width: 0; }
  /* iOS přibližuje stránku, když má pole písmo menší než 16 px. */
  .pole select, .pole input[type=search] {
    width: 100%; min-width: 0; min-height: 44px; font-size: 16px;
  }
  .pole input[type=range] { width: 100%; min-height: 32px; }
  .pole label { white-space: normal; }
  .prepinac { flex: 1 1 100%; min-height: 44px; font-size: 15px; }
  .prepinac input { width: 20px; height: 20px; }
  .reset { flex: 1 1 100%; text-align: left; min-height: 44px; font-size: 15px; }

  .seznam { grid-template-columns: 1fr; gap: 14px; }
  /* iOS přibližuje stránku, když má pole písmo menší než 16 px. */
  .razeni { flex: 1 1 100%; }
  .razeni select { flex: 1; min-height: 44px; font-size: 16px; }
  .razeni .smer { min-height: 44px; font-size: 16px; }
  .odkazy a { min-height: 42px; }
}
@media (max-width: 420px) {
  .pole, .prepinac { flex: 1 1 100%; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
<script>
/* Ručně zvolený vzhled se nastaví hned, ať stránka při načtení neproblikne. */
try {
  const vzhled = localStorage.getItem('reality-brno:vzhled');
  if (vzhled) document.documentElement.dataset.theme = vzhled;
} catch (e) {}
</script>
</head>
<body>

<header class="hlavicka">
  <div class="hlavicka-radek">
    <div>
      <h1>Bydlení v dojezdu Brna</h1>
      <p class="podtitul">Aktualizováno 31. 10. 2026 v 18:31 &middot; 465 nabídek <b id="nove-souhrn">1 nových od minula</b></p>
    </div>

<script>
const NABIDKY = JSON.parse(document.getElementById('data').textContent);
const LINKY = JSON.parse(document.getElementById('linky-data').textContent);
const CIL = "FF MU";

/* "Nové" podle prohlížeče, ne podle běhu skriptu.
   Skript označí za nové to, co přibylo od jeho minulého běhu — při třech
   bězích denně to pro člověka, který se dívá jednou za dva dny, nic neříká.
   Prohlížeč si proto pamatuje, co už tady bylo vidět, a "nové" znamená
   "od mé poslední návštěvy". Každé zařízení zvlášť. */
(function noveOdMinuleNavstevy() {
  const KLIC = 'reality-brno:videne';
  const NAVSTEVA_MS = 30 * 60 * 1000;   // reload do půl hodiny je táž návštěva
  const ted = Date.now();
  const aktualni = NABIDKY.map(n => n.id);

  let ulozene = null;
  try { ulozene = JSON.parse(localStorage.getItem(KLIC)); } catch (e) {}
  if (ulozene && !Array.isArray(ulozene.ids)) ulozene = null;

  let nove, minulaNavsteva;
  if (!ulozene) {
    // První návštěva na tomhle zařízení: převzít, co označil skript.
    nove = new Set(NABIDKY.filter(n => n.nove).map(n => n.id));
    minulaNavsteva = null;
  } else if (ted - ulozene.cas < NAVSTEVA_MS) {
    // Reload během prohlížení nesmí štítky shodit.
    nove = new Set(ulozene.nove || []);
    minulaNavsteva = ulozene.minulaNavsteva;
  } else {
    const videne = new Set(ulozene.ids);
    nove = new Set(aktualni.filter(id => !videne.has(id)));
    minulaNavsteva = ulozene.cas;
  }

  NABIDKY.forEach(n => n.nove = nove.has(n.id));

  const ids = ulozene ? [...new Set([...ulozene.ids, ...aktualni])].slice(-3000) : aktualni;
  try {
    localStorage.setItem(KLIC, JSON.stringify(
      { ids, cas: ted, nove: [...nove], minulaNavsteva }));
  } catch (e) {}   // soukromý režim apod. — funguje to i bez ukládání

  function pred(ms) {
    const min = Math.round(ms / 60000);
    if (min < 60) return 'před ' + min + ' min';
    const h = Math.round(min / 60);
    if (h < 24) return 'před ' + h + (h === 1 ? ' hodinou' : h < 5 ? ' hodinami' : ' hodinami');
    const d = Math.round(h / 24);
    return d === 1 ? 'včera' : 'před ' + d + (d < 5 ? ' dny' : ' dny');
  }
  const souhrn = document.getElementById('nove-souhrn');
  if (!ulozene) {
    souhrn.textContent = nove.size + ' nových od minulého běhu';
  } else {
    souhrn.textContent = nove.size + ' nových pro vás'
      + (minulaNavsteva ? ' (naposledy ' + pred(ted - minulaNavsteva) + ')' : '');
  }
})();
const aktivniLinky = new Set();

const kc = n => n.toLocaleString('cs-CZ') + ' Kč';
const metry = m => m >= 1000 ? (m / 1000).toFixed(1).replace('.', ',') + ' km' : m + ' m';
const el = id => document.getElementById(id);

/* Přehled linek v hlavičce, zároveň slouží jako filtr. */
(function vykresliLinky() {
  const pocty = {};
  NABIDKY.forEach(n => pocty[n.linka] = (pocty[n.linka] || 0) + 1);
  const box = el('linky');
  Object.entries(LINKY).forEach(([klic, info]) => {
    if (!pocty[klic]) return;
    const tlacitko = document.createElement('button');
    tlacitko.className = 'linka-chip';
    tlacitko.setAttribute('aria-pressed', 'false');
    tlacitko.title = info.popis;
    tlacitko.innerHTML = '<span class="tecka" style="background:' + info.barva + '"></span>'
      + '<span>' + info.popis + '</span>'
      + '<span class="pocet">' + pocty[klic] + '</span>';
    tlacitko.onclick = () => {
      aktivniLinky.has(klic) ? aktivniLinky.delete(klic) : aktivniLinky.add(klic);
      tlacitko.setAttribute('aria-pressed', aktivniLinky.has(klic));
      vykresli();
    };
    box.appendChild(tlacitko);
  });
})();

/* Nabídka zdrojů. */
(function naplnZdroje() {
  const pocty = {};
  NABIDKY.forEach(n => (n.zdroje || [n.zdroj]).forEach(
    z => pocty[z] = (pocty[z] || 0) + 1));
  const vyber = el('f-zdroj');
  Object.entries(pocty).sort((a, b) => b[1] - a[1]).forEach(([zdroj, pocet]) => {
    const volba = document.createElement('option');
    volba.value = zdroj;
    volba.textContent = zdroj + ' (' + pocet + ')';
    vyber.appendChild(volba);
  });
  if (Object.keys(pocty).length < 2) vyber.closest('.pole').hidden = true;
})();

/* Rozsahy jezdců se odvodí z dat. Napevno zadané meze by měly hluchá
   pásma — jezdec by šel posouvat, aniž by se cokoli filtrovalo. */
function nastavJezdec(id, hodnoty, rezim, pevne) {
  const prvek = el(id);
  const cisla = hodnoty.filter(v => typeof v === 'number' && isFinite(v));
  if (!cisla.length) {
    prvek.dataset.vypnuto = '1';
    prvek.closest('.pole').hidden = true;
    return;
  }
  const krok = +prvek.step || 1;
  let min = Math.floor(Math.min(...cisla) / krok) * krok;
  let max = Math.ceil(Math.max(...cisla) / krok) * krok;
  if (min === max) { min = Math.max(0, min - krok); max = max + krok; }
  if (pevne) [min, max] = pevne;
  prvek.min = min;
  prvek.max = max;
  prvek.value = rezim === 'od' ? min : max;
}

/* Jezdec na krajní poloze znamená "neomezovat". */
function volny(id, rezim) {
  const prvek = el(id);
  if (prvek.dataset.vypnuto) return true;
  return rezim === 'od' ? +prvek.value <= +prvek.min : +prvek.value >= +prvek.max;
}

(function nastavRozsahy() {
  const hodnoty = klic => NABIDKY.map(n => n[klic]);
  nastavJezdec('f-cena-od', hodnoty('cena'), 'od');
  nastavJezdec('f-cena', hodnoty('cena'), 'do');
  // U plochy a pozemku by krajní hodnoty z dat (vila, pole) roztáhly jezdec
  // tak, že by běžný rozsah zabral pár pixelů. Meze jsou proto pevné.
  nastavJezdec('f-plocha', hodnoty('plocha'), 'od', [0, 300]);
  nastavJezdec('f-plocha-do', hodnoty('plocha'), 'do', [0, 300]);
  nastavJezdec('f-pozemek', hodnoty('pozemek'), 'od', [500, 3000]);
  nastavJezdec('f-pozemek-do', hodnoty('pozemek'), 'do', [500, 3000]);
  nastavJezdec('f-auto', hodnoty('autem'), 'do');
  nastavJezdec('f-nadrazi', hodnoty('vlak_m'), 'do');
  nastavJezdec('f-mhd-real', hodnoty('mhd_min'), 'do');
  nastavJezdec('f-mhd', hodnoty('mhd_cil'), 'do');
  // Odhad schovat jen tehdy, když skutečné časy pokrývají skoro všechno.
  // Při částečném pokrytí by se filtrování zbytku nabídek ztratilo.
  const sJizdnimRadem = NABIDKY.filter(n => typeof n.mhd_min === 'number').length;
  if (sJizdnimRadem >= NABIDKY.length * 0.9) {
    el('f-mhd').closest('.pole').hidden = true;
  }
})();

/* Nabídka obcí, seřazená podle četnosti. */
(function naplnObce() {
  const pocty = {};
  NABIDKY.forEach(n => pocty[n.obec] = (pocty[n.obec] || 0) + 1);
  Object.entries(pocty).sort((a, b) => b[1] - a[1]).forEach(([obec, pocet]) => {
    const volba = document.createElement('option');
    volba.value = obec;
    volba.textContent = obec + ' (' + pocet + ')';
    el('f-obec').appendChild(volba);
  });
})();

/* Ikony (Lucide, MIT), vložené přímo — stránka funguje i offline. */
const svg = cesty => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '
  + 'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + cesty + '</svg>';
const IKONY = {
  auto: svg('<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>'),
  mhd: svg('<path d="M8 6v6"/><path d="M15 6v6"/><path d="M2 12h19.6"/><path d="M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3"/><circle cx="7" cy="18" r="2"/><path d="M9 18h5"/><circle cx="16" cy="18" r="2"/>'),
  vlak: svg('<path d="M8 3.1V7a4 4 0 0 0 8 0V3.1"/><path d="m9 15-1-1"/><path d="m15 15 1-1"/><path d="M9 19c-2.8 0-5-2.2-5-5v-4a8 8 0 0 1 16 0v4c0 2.8-2.2 5-5 5Z"/><path d="m8 19-2 3"/><path d="m16 19 2 3"/>'),
  pesky: svg('<circle cx="12" cy="5" r="1"/><path d="m9 20 3-6 3 6"/><path d="m6 8 6 2 6-2"/><path d="M12 10v4"/>'),
  dum: svg('<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),
  pozemek: svg('<path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/>'),
};

/* Krátký název linky do odznaku na fotce: "S3-sever" -> "S3". */
const zkratkaLinky = klic => /^S[0-9]/.test(klic) ? klic.split('-')[0]
  : klic === 'brno' ? 'MHD' : 'Auto';

function cas(ikona, hodnota, popis, odhad) {
  return '<div class="cas' + (odhad ? ' odhad' : '') + '">' + IKONY[ikona]
    + '<span><b>' + hodnota + ' min</b>' + popis + '</span></div>';
}

const dny = d => d === 1 ? 'den' : d >= 2 && d <= 4 ? 'dny' : 'dní';

/* Jak dlouho nabídka visí, podle data, kdy ji skript poprvé uviděl.
   U nabídek z prvního běhu skutečné stáří neznáme, proto "58+ dní". */
function naTrhu(n) {
  if (!n.poprve) return '';
  const [r, m, d] = n.poprve.split('-').map(Number);
  const dnes = new Date();
  const pocet = Math.round((new Date(dnes.getFullYear(), dnes.getMonth(), dnes.getDate())
    - new Date(r, m - 1, d)) / 864e5);
  if (n.poprve_odhad && pocet > 0)
    return '<span class="stitek tlumeny" title="Byla tu už při prvním běhu ('
      + d + '. ' + m + '. ' + r + '), ve skutečnosti může viset déle">na trhu ' + pocet + '+ dní</span>';
  return '<span class="stitek tlumeny" title="Poprvé viděno ' + d + '. ' + m + '. ' + r + '">'
    + (pocet <= 0 ? 'na trhu od dneška' : 'na trhu ' + pocet + ' ' + dny(pocet)) + '</span>';
}

function radekHtml(n) {
  const linka = LINKY[n.linka] || {};
  const barva = linka.barva || '#6B7A85';

  const odznaky = [];
  if (n.nove) odznaky.push('<span class="odznak novy">Nové</span>');
  if ((n.zdroje || []).length > 1) odznaky.push('<span class="odznak">Na obou webech</span>');
  else if (n.zdroj === 'Bezrealitky') odznaky.push('<span class="odznak">Bez provize</span>');
  odznaky.push('<span class="odznak linka" title="' + (linka.popis || '') + '">'
    + zkratkaLinky(n.linka) + '</span>');

  const stitky = [];
  if (n.dispozice) stitky.push('<span class="stitek">' + n.dispozice + '</span>');
  if (n.plocha) stitky.push('<span class="stitek">' + n.plocha + ' m²</span>');
  if (n.pozemek) stitky.push('<span class="stitek">pozemek ' + n.pozemek.toLocaleString('cs-CZ') + ' m²</span>');
  if (n.druh_neuveden) stitky.push('<span class="stitek odhad" '
    + 'title="Inzerent nevyplnil druh pozemku — ověř v inzerátu, že je stavební">'
    + 'druh neuveden</span>');
  if (n.garaz) stitky.push('<span class="stitek garaz">Garáž / stání</span>');
  const stari = naTrhu(n);
  if (stari) stitky.push(stari);
  if (n.vlak_m) stitky.push('<span class="stitek tlumeny">nádraží ' + metry(n.vlak_m) + '</span>');
  if (n.obchod_m) stitky.push('<span class="stitek tlumeny">obchod ' + metry(n.obchod_m) + '</span>');
  if (n.skola_m) stitky.push('<span class="stitek tlumeny">škola ' + metry(n.skola_m) + '</span>');
  if (n.auto_km) stitky.push('<span class="stitek tlumeny">' + CIL + ' '
    + String(n.auto_km).replace('.', ',') + ' km po silnici</span>');

  const casy = [];
  if (n.auto_min) casy.push(cas('auto', n.auto_min, 'autem na ' + CIL));
  else if (n.autem) casy.push(cas('auto', n.autem, 'do centra', true));
  if (n.mhd_min) casy.push(cas('mhd', n.mhd_min, 'MHD z domu'));
  else if (n.mhd_cil) casy.push(cas('mhd', '~' + n.mhd_cil, 'MHD odhad', true));
  if (n.pesky_min) casy.push(cas('pesky', n.pesky_min, 'pěšky'));
  else if (n.vlakem) casy.push(cas('vlak', n.vlakem, 'vlakem'));

  const odkazy = [];
  if (n.trasa_auto) odkazy.push('<a href="' + n.trasa_auto
    + '" target="_blank" rel="noopener">Trasa autem</a>');
  if (n.trasa_mhd) odkazy.push('<a href="' + n.trasa_mhd
    + '" target="_blank" rel="noopener">Spojení MHD</a>');

  return '<article class="karta" style="--barva-linky:' + barva + '">'
    + '<a class="foto" href="' + n.url + '" target="_blank" rel="noopener" tabindex="-1">'
    +   '<span class="foto-prazdna">' + IKONY[n.typ === 'pozemek' ? 'pozemek' : 'dum'] + '</span>'
    +   (n.obrazek
        ? '<img src="' + n.obrazek + '" alt="" loading="lazy" '
          + 'referrerpolicy="no-referrer" onerror="this.remove()">'
        : '')
    +   '<span class="odznaky">' + odznaky.join('') + '</span>'
    + '</a>'
    + '<div class="telo">'
    +   '<div class="misto"><span class="tecka"></span><span>' + n.obec + '</span></div>'
    +   '<h2 class="titulek"><a href="' + n.url + '" target="_blank" rel="noopener">'
    +     n.nazev + '</a></h2>'
    +   '<div class="cena-radek"><span class="cena">' + kc(n.cena) + '</span>'
    +     (n.cena_m2 ? '<span class="cena-m2">' + kc(n.cena_m2) + ' / m²</span>' : '')
    +   '</div>'
    +   '<div class="parametry">' + stitky.join('') + '</div>'
    +   (casy.length ? '<div class="casy">' + casy.join('') + '</div>' : '')
    +   (odkazy.length ? '<div class="odkazy">' + odkazy.join('') + '</div>' : '')
    + '</div>'
    + '</article>';
}

function vykresli() {
  const typ = el('f-typ').value;
  const zdroj = el('f-zdroj').value;
  const obec = el('f-obec').value;
  let minCena = +el('f-cena-od').value;
  const maxCena = +el('f-cena').value;
  // Spodní hranice nesmí přeskočit horní.
  if (minCena > maxCena) { minCena = maxCena; el('f-cena-od').value = minCena; }
  let minPlocha = +el('f-plocha').value;
  const maxPlocha = +el('f-plocha-do').value;
  if (minPlocha > maxPlocha) { minPlocha = maxPlocha; el('f-plocha').value = minPlocha; }
  let minPozemek = +el('f-pozemek').value;
  const maxPozemek = +el('f-pozemek-do').value;
  if (minPozemek > maxPozemek) { minPozemek = maxPozemek; el('f-pozemek').value = minPozemek; }
  const maxAuto = +el('f-auto').value;
  const maxNadrazi = +el('f-nadrazi').value;
  const maxMhd = +el('f-mhd').value;
  const maxMhdReal = +el('f-mhd-real').value;
  const jenGaraz = el('f-garaz').checked;
  const hledat = el('f-hledat').value.trim().toLowerCase();
  const razeni = el('f-razeni').value;

  const mil = c => (c / 1e6).toFixed(2).replace('.', ',') + ' mil.';
  const bezPlochy = volny('f-plocha', 'od');
  const bezPlochyDo = volny('f-plocha-do', 'do');
  const bezPozemku = volny('f-pozemek', 'od');
  const bezPozemkuDo = volny('f-pozemek-do', 'do');
  const bezAuta = volny('f-auto', 'do');
  const bezNadrazi = volny('f-nadrazi', 'do');
  const bezMhd = volny('f-mhd', 'do');
  const bezMhdReal = volny('f-mhd-real', 'do');

  el('v-cena').textContent = mil(maxCena);
  el('v-cena-od').textContent = mil(minCena);
  el('v-plocha').textContent = bezPlochy ? 'bez omezení' : minPlocha + ' m²';
  el('v-pozemek').textContent = bezPozemku ? 'bez omezení' : minPozemek + ' m²';
  el('v-plocha-do').textContent = bezPlochyDo ? 'bez omezení' : maxPlocha + ' m²';
  el('v-pozemek-do').textContent = bezPozemkuDo ? 'bez omezení' : maxPozemek + ' m²';
  el('v-auto').textContent = bezAuta ? 'bez omezení' : 'do ' + maxAuto + ' min';
  el('v-nadrazi').textContent = bezNadrazi ? 'bez omezení' : 'do ' + metry(maxNadrazi);
  el('v-mhd').textContent = bezMhd ? 'bez omezení' : 'do ' + maxMhd + ' min';
  el('v-mhd-real').textContent = bezMhdReal ? 'bez omezení' : 'do ' + maxMhdReal + ' min';

  let vybrane = NABIDKY.filter(n =>
    (!typ || n.typ === typ) &&
    (!zdroj || (n.zdroje || [n.zdroj]).includes(zdroj)) &&
    (!obec || n.obec === obec) &&
    (!aktivniLinky.size || aktivniLinky.has(n.linka)) &&
    n.cena >= minCena && n.cena <= maxCena &&
    (bezPlochy || (n.plocha || 0) >= minPlocha) &&
    (bezPozemku || (n.pozemek || 0) >= minPozemek) &&
    (bezPlochyDo || (n.plocha && n.plocha <= maxPlocha)) &&
    (bezPozemkuDo || (n.pozemek && n.pozemek <= maxPozemek)) &&
    (bezAuta || (n.autem && n.autem <= maxAuto)) &&
    (bezNadrazi || (n.vlak_m && n.vlak_m <= maxNadrazi)) &&
    (bezMhd || (n.mhd_cil && n.mhd_cil <= maxMhd)) &&
    (bezMhdReal || (n.mhd_min && n.mhd_min <= maxMhdReal)) &&
    (!jenGaraz || n.garaz === true) &&
    (!hledat || (n.nazev + ' ' + n.lokalita).toLowerCase().includes(hledat))
  );

  // Nabídky bez údaje jdou vždy na konec, ať se řadí kterýmkoli směrem.
  const klice = {
    cena:     n => n.cena,
    cena_m2:  n => n.cena_m2,
    vlakem:   n => n.vlakem,
    vlak_m:   n => n.vlak_m,
    mhd_min:  n => n.mhd_min,
    mhd_cil:  n => n.mhd_cil,
    km_cil:   n => n.km_cil,
    autem:    n => n.autem,
    plocha:   n => n.plocha,
    pozemek:  n => n.pozemek,
    nove:     n => n.poprve && n.poprve + (n.nove ? '1' : '0'),
  };
  const klic = klice[razeni];
  const smer = el('f-smer').dataset.smer === 'sestupne' ? -1 : 1;
  vybrane.sort((a, b) => {
    const ka = klic(a), kb = klic(b);
    if (!ka || !kb) return (!ka) - (!kb);
    return ka > kb ? smer : ka < kb ? -smer : 0;
  });

  const aktivnich = [
    typ, zdroj, obec, hledat, jenGaraz,
    aktivniLinky.size,
    !volny('f-cena-od', 'od'), !volny('f-cena', 'do'),
    !bezPlochy, !bezPlochyDo, !bezPozemku, !bezPozemkuDo, !bezAuta, !bezNadrazi, !bezMhd, !bezMhdReal,
  ].filter(Boolean).length;
  const znacka = el('filtry-pocet');
  znacka.textContent = aktivnich;
  znacka.classList.toggle('aktivni', aktivnich > 0);

  el('souhrn').textContent = vybrane.length
    ? vybrane.length + ' z ' + NABIDKY.length + ' nabídek odpovídá filtrům'
    : '';
  el('seznam').innerHTML = vybrane.length
    ? vybrane.map(radekHtml).join('')
    : '<div class="prazdno">Filtrům neodpovídá žádná nabídka. Zkus zvednout cenový strop nebo povolit delší dojezd.</div>';
}

document.querySelectorAll('.filtry input, .filtry select').forEach(prvek => {
  prvek.addEventListener('input', vykresli);
});
function nastavSmer(smer) {
  const tlacitko = el('f-smer');
  tlacitko.dataset.smer = smer;
  tlacitko.textContent = smer === 'sestupne' ? '↓ Sestupně' : '↑ Vzestupně';
}
const vychoziSmer = () => el('f-razeni').selectedOptions[0].dataset.smer || 'vzestupne';
nastavSmer(vychoziSmer());
el('f-razeni').addEventListener('change', () => {
  nastavSmer(vychoziSmer());
  vykresli();
});
el('f-smer').onclick = () => {
  nastavSmer(el('f-smer').dataset.smer === 'sestupne' ? 'vzestupne' : 'sestupne');
  vykresli();
};

el('reset').onclick = () => {
  el('f-typ').value = ''; el('f-obec').value = '';
  el('f-zdroj').value = '';
  [['f-cena-od', 'od'], ['f-cena', 'do'], ['f-plocha', 'od'], ['f-plocha-do', 'do'],
   ['f-pozemek', 'od'], ['f-pozemek-do', 'do'], ['f-auto', 'do'], ['f-nadrazi', 'do'],
   ['f-mhd', 'do'], ['f-mhd-real', 'do']].forEach(([id, rezim]) => {
    el(id).value = rezim === 'od' ? el(id).min : el(id).max;
  });
  el('f-garaz').checked = false;
  el('f-hledat').value = '';
  aktivniLinky.clear();
  document.querySelectorAll('.linka-chip').forEach(t => t.setAttribute('aria-pressed', 'false'));
  vykresli();
};

/* Přepínač světlého a tmavého vzhledu. Bez ručního výběru se řídí systémem. */
el('vzhled').onclick = () => {
  const koren = document.documentElement;
  const tmavy = koren.dataset.theme
    ? koren.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  koren.dataset.theme = tmavy ? 'light' : 'dark';
  try { localStorage.setItem('reality-brno:vzhled', koren.dataset.theme); } catch (e) {}
};

/* Filtry se na úzkém displeji sbalí, jinak zůstávají otevřené. */
(function sbalovaniFiltru() {
  const panel = el('filtry-vnitrek');
  const tlacitko = el('filtry-prepinac');
  const znacka = el('filtry-znacka');
  const uzko = window.matchMedia('(max-width: 760px)');

  function nastav(otevreno) {
    panel.hidden = !otevreno;
    tlacitko.setAttribute('aria-expanded', otevreno);
    znacka.textContent = otevreno ? 'Skrýt' : 'Zobrazit';
  }
  function podleSirky() { nastav(!uzko.matches); }

  tlacitko.onclick = () => nastav(panel.hidden);
  uzko.addEventListener('change', podleSirky);
  podleSirky();
})();

vykresli();
</script>
</body>
</html>
